# Amplify Hosting build spec (ADR-001 of the app's repository: the site is
# served by Amplify Hosting). The app is connected to this repository; a push
# to main builds and deploys. Node 22 is the project's engine (package.json),
# pnpm comes from Corepack at the version package.json pins.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - corepack enable
        - pnpm install --frozen-lockfile
        # Saiga, Kuutti's typeface, from the association's private repository,
        # with the read-only token the maintainer keeps in FONTS_TOKEN here and
        # nowhere else; without it the site is built in Inter (docs/decisions.md, 18).
        - node scripts/fetch-saiga.ts
    build:
      commands:
        - pnpm build
        # A site with a script other than the pond's, a dead link or something loaded from elsewhere is not deployed.
        - pnpm check:site
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
