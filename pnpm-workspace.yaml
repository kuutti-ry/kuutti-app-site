# One package; the file exists for pnpm's settings.
packages:
  - "."

# Astro's bundler. Allowed deliberately; sharp is not: the site optimises no
# image at build time, and pnpm 12 treats an undeclared ignored build as an
# install error.
allowBuilds:
  esbuild: true
  sharp: false

# Supply chain: a version must be at least one day old before pnpm installs it
# (pnpm's default, stated explicitly), as in the app's repository.
minimumReleaseAge: 1440

# Security floors, as in the app's repository. undici under unifont (Astro's
# font provider, which this site does not use: Inter and Saiga are its own
# files): GHSA-xjj6-f33q-929c, failing the audit gate since 2026-10-24.
# Patched within its major; drop the floor once unifont asks for it itself.
overrides:
  "undici@8": ">=8.12.2 <9"

# @astrojs/check's astro2tsx 0.1.2 brings @emnapi/core 1.11.3 but takes
# @emnapi/runtime as a peer of @napi-rs/wasm-runtime, and since Astro 7.4.7's
# Rolldown 1.3.0 that peer resolves to 2.0.0-beta.2, which does not fit the
# 1.11.3 core: @astrojs/check throws as it loads, and `astro check` says it is
# not installed. astro2tsx 0.1.4 depends on @emnapi/runtime 1.11.3 itself;
# this gives 0.1.2 the same. shortcut: holds only for 0.1.2; remove it once the
# lockfile has astro2tsx 0.1.4 or later.
packageExtensions:
  "@astrojs/astro2tsx@0.1.2":
    dependencies:
      "@emnapi/runtime": "1.11.3"

# pnpm audit: one advisory set aside, with its reason. GHSA-ch52-4w7c-c8xp
# (http-cache-semantics <= 4.2.0, high, no patched version yet) is about a
# shared cache that serves many users. Astro uses the package only to cache
# remote images while it builds (astro/dist/assets/build/remote.js); the site
# fetches no remote image (rule 1) and runs no server, so nothing is cached
# for anybody. Remove the entry when a patched version exists or Astro drops
# the package.
auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
