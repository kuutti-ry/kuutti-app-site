name: pnpm
description: Node 22 with pnpm from Corepack (hash-verified via packageManager) and a cached store; installs the workspace unless told not to.

inputs:
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Corepack first so setup-node can size the pnpm store cache. The cache
    # exists only when something is installed; without an install the post
    # step would fail on the missing store path.
    - name: Enable pnpm
      shell: bash
      run: corepack enable

    # The newest Node 22, as Amplify's nvm install 22 takes, not the one the
    # runner image has cached: Astro asks for a patch release (package.json's
    # engines) days before the image carries it.
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        check-latest: true
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - name: Install
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
