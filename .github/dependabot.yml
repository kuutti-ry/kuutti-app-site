version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Minor and patch bumps arrive as one pull request a week; majors come
  # alone so they get read.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The types follow the runtime, as in the app's repository. Node 22 is
      # the site's engine (package.json) and Amplify builds on it
      # (amplify.yml), so the types of a newer major would promise functions
      # the build does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
