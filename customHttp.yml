# The headers Amplify Hosting sends with every answer. The policy is the
# site's promise in a form a browser enforces: nothing runs, nothing is
# loaded from anybody else (the typeface is the site's own file), nothing is
# framed, nothing is posted.
customHeaders:
  # The machine versions of the pages (src/lib/machine.ts) are Markdown, read
  # as plain text in a browser; search engines index the pages, not these.
  - pattern: "**/*.md"
    headers:
      - key: Content-Type
        value: "text/plain; charset=utf-8"
      - key: X-Robots-Tag
        value: "noindex"
  - pattern: "/llms.txt"
    headers:
      - key: Content-Type
        value: "text/plain; charset=utf-8"
  - pattern: "**"
    headers:
      - key: Content-Security-Policy
        value: "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: Referrer-Policy
        value: "no-referrer"
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - key: Cross-Origin-Opener-Policy
        value: "same-origin"
      - key: Cross-Origin-Resource-Policy
        value: "same-origin"
